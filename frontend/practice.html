<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAP | Bharat Address Protocol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; overflow-x: hidden; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .canvas-container { touch-action: none; position: relative; background: #1e293b; border-radius: 1.5rem; overflow: visible; }
        .turn-input { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); width: 75px; text-align: center; border-radius: 8px; padding: 6px; color: #fbbf24; font-weight: bold; font-size: 12px; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: 0.3s; }
        .btn-primary:active { transform: scale(0.98); }
        
        /* Start Bubble Vector */
        .bubble-hint {
            position: absolute; left: 50%; top: -45px; transform: translateX(-50%);
            background: #3b82f6; color: white; padding: 5px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
        }
        .bubble-hint::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
            border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #3b82f6;
        }

        /* Sidebar Navigation */
        #sidebar { transition: transform 0.3s ease; transform: translateX(100%); z-index: 100; }
        #sidebar.open { transform: translateX(0); }

        /* Blinking Animation */
        @keyframes blink-glow {
            0%, 100% { filter: drop-shadow(0 0 2px #3b82f6); opacity: 1; }
            50% { filter: drop-shadow(0 0 12px #3b82f6); opacity: 0.6; }
        }
        .blinking-dot { animation: blink-glow 1s infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <button onclick="toggleMenu()" class="fixed top-6 right-6 z-[110] p-3 glass rounded-xl">
        <div class="w-6 h-0.5 bg-white mb-1.5"></div>
        <div class="w-6 h-0.5 bg-white mb-1.5"></div>
        <div class="w-6 h-0.5 bg-white"></div>
    </button>

    <div id="sidebar" class="fixed top-0 right-0 h-full w-72 glass p-8 shadow-2xl">
        <h2 class="text-xl font-bold mb-6 text-blue-400">My Addresses</h2>
        <div id="sidebar-content" class="space-y-4 text-gray-400 text-sm italic">No PAID saved yet.</div>
    </div>

    <div class="card glass w-full max-w-md p-6 rounded-[2.5rem] relative">
        <div class="flex items-center mb-6">
            <button onclick="location.reload()" class="p-2 hover:bg-white/10 rounded-full text-xl">🏠</button>
            <h1 class="flex-1 text-center text-2xl font-black italic tracking-tighter text-blue-400">BAP.</h1>
            <div class="w-10"></div>
        </div>

        <div id="home-screen">
            <div class="grid gap-4 mt-8">
                <button onclick="showScreen('send')" class="btn-primary p-6 rounded-3xl text-left shadow-lg">
                    <span class="text-2xl block font-bold">📤 SEND</span>
                    <span class="text-blue-100 text-sm opacity-70">Design a route to your door</span>
                </button>
                <button onclick="showScreen('get')" class="bg-white/5 hover:bg-white/10 p-6 rounded-3xl text-left border border-white/10">
                    <span class="text-2xl block font-bold">📥 GET</span>
                    <span class="text-gray-400 text-sm">Find someone using their PAID</span>
                </button>
            </div>
        </div>

        <div id="send-screen" class="hidden">
            <input type="text" id="landmark-name" placeholder="Landmark (e.g. Milk Booth)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 outline-none focus:border-blue-500">
            
            <div class="canvas-container mx-auto border-2 border-blue-500/20">
                <div class="bubble-hint blinking-dot">Start from here</div>
                <canvas id="sendCanvas"></canvas>
            </div>

            <div class="mt-6 overflow-x-auto pb-4">
                <table class="mx-auto border-separate border-spacing-x-4">
                    <tr id="row-inputs"></tr>
                    <tr id="row-dir" class="text-lg font-bold text-gray-400 whitespace-nowrap"></tr>
                </table>
            </div>

            <button onclick="saveRoute()" class="btn-primary w-full p-4 rounded-2xl mt-4 font-bold shadow-xl">SUBMIT & GET PAID</button>
            
            <div id="post-submit-box" class="hidden mt-8 p-6 bg-green-500/20 border border-green-500/30 rounded-3xl text-center">
                <p class="text-xs font-bold text-green-400 uppercase tracking-widest">Address ID Created</p>
                <span id="new-paid" class="text-3xl font-black block my-2 text-white"></span>
                <button onclick="copyCurrentPaid()" class="text-sm bg-white/10 px-4 py-2 rounded-lg hover:bg-white/20">Copy PAID</button>
            </div>
        </div>

        <div id="get-screen" class="hidden">
            <input type="text" id="id-input" placeholder="BAP-XXXX" class="w-full bg-white/5 border border-white/20 p-5 rounded-2xl text-2xl text-center font-black tracking-widest mb-6 uppercase">
            <button onclick="startNavigation()" class="btn-primary w-full p-4 rounded-2xl font-bold shadow-lg">REVEAL MISSION</button>
        </div>

        <div id="nav-screen" class="hidden text-center">
            <div id="countdown" class="text-8xl font-black text-blue-500 my-16">3</div>
            <div id="route-area" class="hidden">
                <div class="canvas-container mx-auto mb-6">
                    <canvas id="getCanvas"></canvas>
                </div>
                <div id="view-timeline" class="mb-4 p-4 bg-white/5 rounded-2xl overflow-x-auto"></div>
                <div id="text-address-box" class="mb-6 p-4 bg-white/5 text-gray-400 text-sm text-left rounded-2xl italic border-l-4 border-blue-500"></div>
                <button onclick="finishJourney()" id="finishBtn" class="w-full bg-yellow-500 text-black p-4 rounded-2xl font-black text-lg shadow-xl hover:bg-yellow-400">🏆 FINISHED</button>
            </div>
        </div>
    </div>

<script>
    const API = "http://localhost:8000";
    let path = [], turns = [], isDrawing = false;
    const gridSize = 40, cols = 9, rows = 10;
    const midX = 4 * gridSize + gridSize/2, midY = gridSize/2;

    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); updateSidebar(); }

    function updateSidebar() {
        const saved = JSON.parse(localStorage.getItem('bap_history') || "[]");
        const container = document.getElementById('sidebar-content');
        if(saved.length === 0) return;
        container.innerHTML = saved.map(id => `
            <div class="p-3 bg-white/5 rounded-xl flex justify-between items-center border border-white/10 mb-2">
                <span class="font-bold text-blue-300">${id}</span>
                <button onclick="copyManual('${id}')" class="text-xs bg-white/10 px-2 py-1 rounded">Copy</button>
            </div>
        `).join('');
    }

    function showScreen(screen) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById(screen + '-screen').classList.remove('hidden');
        if(screen === 'send') initSend();
    }

    function initSend() {
        const cvs = document.getElementById('sendCanvas');
        const ctx = cvs.getContext('2d');
        cvs.width = cols * gridSize; cvs.height = rows * gridSize;
        path = [{x: midX, y: midY}];
        renderPath(ctx, path);

        const getCoords = (e) => {
            const rect = cvs.getBoundingClientRect();
            const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return {
                x: Math.floor(cx / gridSize) * gridSize + gridSize/2,
                y: Math.floor(cy / gridSize) * gridSize + gridSize/2
            };
        };

        const onStart = (e) => { isDrawing = true; };
        const onMove = (e) => {
            if(!isDrawing) return;
            const pos = getCoords(e);
            if(pos.x < 0 || pos.x > cvs.width || pos.y < 0 || pos.y > cvs.height) return;
            const last = path[path.length-1];
            if(pos.x !== last.x || pos.y !== last.y) {
                path.push(pos);
                updateTurns();
                renderPath(ctx, path);
            }
        };

        cvs.onmousedown = onStart; cvs.ontouchstart = (e) => { onStart(); e.preventDefault(); };
        window.onmousemove = onMove; window.ontouchmove = (e) => { onMove(e); e.preventDefault(); };
        window.onmouseup = window.ontouchend = () => { isDrawing = false; };
    }

    function updateTurns() {
        turns = [];
        for(let i=2; i < path.length; i++) {
            const p1 = path[i-2], p2 = path[i-1], p3 = path[i];
            const val = (p2.x - p1.x) * (p3.y - p2.y) - (p2.y - p1.y) * (p3.x - p2.x);
            if(val > 0) turns.push("R"); else if(val < 0) turns.push("L");
        }
        renderTable();
    }

    function renderTable() {
        const rowDir = document.getElementById('row-dir');
        const rowInp = document.getElementById('row-inputs');
        rowDir.innerHTML = '<td>LM</td>';
        rowInp.innerHTML = '<td>&nbsp;</td>';
        turns.forEach((t, i) => {
            rowInp.innerHTML += `<td><input type="text" placeholder="${i+1}st" class="turn-input" id="inp-${i}"></td>`;
            rowDir.innerHTML += `<td class="text-blue-400">→ ${t}</td>`;
        });
        rowDir.innerHTML += '<td>→ D</td>';
    }

    function renderPath(ctx, pArr) {
        ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        // Draw Dots
        for(let i=0; i<cols; i++) {
            for(let j=0; j<rows; j++) {
                ctx.fillStyle = "#334155"; ctx.beginPath(); ctx.arc(i*gridSize + gridSize/2, j*gridSize + gridSize/2, 2, 0, Math.PI*2); ctx.fill();
            }
        }
        // Draw Route
        ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath(); ctx.moveTo(pArr[0].x, pArr[0].y);
        pArr.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        
        // Landmark Glow (Blue)
        ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(midX, midY, 5, 0, Math.PI*2); ctx.fill();
        
        // Destination Glow (Yellow/Gold)
        if(pArr.length > 1) {
            ctx.shadowBlur = 10; ctx.shadowColor = "#fbbf24";
            ctx.fillStyle = "#fbbf24"; ctx.beginPath(); 
            ctx.arc(pArr[pArr.length-1].x, pArr[pArr.length-1].y, 6, 0, Math.PI*2); 
            ctx.fill();
            ctx.shadowBlur = 0; // reset
        }
    }

    async function saveRoute() {
        const turn_labels = turns.map((_, i) => document.getElementById(`inp-${i}`).value || `${i+1}st`);
        const res = await fetch(`${API}/save-route`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({landmark: document.getElementById('landmark-name').value, path, turns, turn_labels})
        });
        const data = await res.json();
        
        // Save to Sidebar
        let history = JSON.parse(localStorage.getItem('bap_history') || "[]");
        history.unshift(data.address_id);
        localStorage.setItem('bap_history', JSON.stringify([...new Set(history)]));
        
        // UI Feedback & Auto Scroll
        const box = document.getElementById('post-submit-box');
        document.getElementById('new-paid').innerText = data.address_id;
        box.classList.remove('hidden');
        setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }

    async function startNavigation() {
        const id = document.getElementById('id-input').value.toUpperCase();
        const res = await fetch(`${API}/get-route/${id}`);
        const data = await res.json();
        document.getElementById('get-screen').classList.add('hidden');
        document.getElementById('nav-screen').classList.remove('hidden');
        let c = 3;
        const timer = setInterval(() => {
            if(c === 1) { 
                clearInterval(timer); 
                document.getElementById('countdown').classList.add('hidden');
                document.getElementById('route-area').classList.remove('hidden');
                displayFinal(data);
            } else { c--; document.getElementById('countdown').innerText = c; }
        }, 800);
    }

    function displayFinal(data) {
        const cvs = document.getElementById('getCanvas');
        const ctx = cvs.getContext('2d');
        cvs.width = cols * gridSize; cvs.height = rows * gridSize;
        renderPath(ctx, data.path);

        let timelineHtml = `<div class="flex gap-4 items-center text-xs font-bold whitespace-nowrap"><span>${data.landmark || "LM"}</span>`;
        let textAddress = `From <b>${data.landmark || "the landmark"}</b>, go straight. `;

        data.turns.forEach((t, i) => {
            timelineHtml += `<div class="bg-blue-500/20 p-2 rounded-lg border border-blue-500/30 text-blue-400">
                                ${data.turn_labels[i]} ${t === 'L' ? 'Left' : 'Right'}
                             </div>`;
            textAddress += `Take the <b>${data.turn_labels[i]} ${t === 'L' ? 'left' : 'right'}</b> and continue straight. `;
        });
        
        timelineHtml += `<span>DEST</span></div>`;
        textAddress += "Finally, you will reach your destination.";

        document.getElementById('view-timeline').innerHTML = timelineHtml;
        document.getElementById('text-address-box').innerHTML = textAddress;
    }

    function finishJourney() {
        // 1. Confetti Burst
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        
        // 2. Voice Message
        const msg = new SpeechSynthesisUtterance("Excellent work Buddy!");
        window.speechSynthesis.speak(msg);
        
        // 3. Redirect to Home after message ends
        msg.onend = () => {
            setTimeout(() => location.reload(), 500);
        };
    }

    function copyCurrentPaid() { copyManual(document.getElementById('new-paid').innerText); }
    function copyManual(txt) { navigator.clipboard.writeText(txt); alert("PAID Copied!"); }
</script>
</body>
</html>
